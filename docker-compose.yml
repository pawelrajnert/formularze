# Domyślnie: LLM po API Mistral (ministral-14b-latest) — sekrety w .env (patrz .env.example).
#   docker compose up --build
#
# Lokalny model (Ollama):
#   docker compose --profile local-llm up --build
#   docker compose exec ollama ollama pull ministral-3:14b   # albo ministral-3:8b przy 16 GB RAM
#   w .env: LLM_BASE_URL=http://ollama:11434/v1  LLM_API_KEY=ollama  LLM_MODEL=ministral-3:14b
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - audit:/app/audit  # F-18: rekordy zatwierdzeń obok JSON-ów
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.17
    profiles: [local-llm]
    volumes:
      - ollama-models:/root/.ollama
    # brak "ports": Ollama dostępna tylko w sieci compose (http://ollama:11434)

volumes:
  ollama-models:
  audit:
