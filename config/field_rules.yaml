# F-08: słowniki, dane inicjalne (prefill) i walidatory rozpoznawane po labelu pola.
# Źródła: "Hacknation - Słowniki (1).docx", "Dane inicjalne - materialy dodatkowe ... (2).pdf",
# przykłady data/1 i data/5 (konfiguracja_form_*.json). Label jest normalizowany: małe litery,
# bez polskich znaków, wszystko poza [a-z0-9] -> spacja ("Adres e-mail *" -> "adres e mail").
# Pierwsza pasująca reguła wygrywa (kolejność ma znaczenie).

# nazwa słownika -> konfiguracja pola SELECT (wartości jak w przykładach data/1, data/5)
dictionaries:
  Kraje: {multiLevelTree: false, searchEnabled: true, default: [Polska]}
  TERYT_4G_DOWODOWY: {multiLevelTree: true, searchEnabled: true}
  TERYT_DOWODOWY: {multiLevelTree: true, searchEnabled: true}
  # nazwa techniczna nieznana z przykładów; wzięta wprost z dokumentu Słowniki ("Słownik Numery kierunkowe"),
  # analogicznie do "Słownik Kraje" -> dictionaryName "Kraje"
  Numery kierunkowe: {multiLevelTree: false, searchEnabled: true}

# źródła danych inicjalnych (PDF, tabela "Dostępne źródła danych"); rejestry wymuszają readOnly
sources: [PESEL, PESEL_ADDRESS, MLPZ]
registry_sources: [PESEL, PESEL_ADDRESS]

# prefill z reguł tylko dla danych wnioskodawcy: pomijamy sekcje o innych osobach i sekcje powtarzalne,
# a każdy klucz dostaje tylko pierwsze pasujące pole w formularzu
# "Adres zamieszkania / siedziby" to adres wnioskodawcy -> lookbehind, żeby go nie pominąć
prefill_skip_sections: "pelnomocni|innej osoby|inna osoba|wspol|malzon|dziec|zmarl|spadko|reprezent|podmiot|(?<!zamieszkania )siedzib|korespondenc|sportowc|kandydat|podopieczn|odpowiedzialn|wykonawc"

# F-15: sprzątanie szkicu LLM (app/form_builder/cleanup.py), regexy na znormalizowanym labelu / tytule sekcji
cleanup:
  # pola papierowe: podpis i data nadaje system, "wypełnia organ" i instrukcje nie należą do e-formularza
  drop: "^(czytelny |wlasnoreczny )?podpis|^data (i )?podpis|pieczat|data (zlozenia|sporzadzenia|wypelnienia)|miejscowosc i data|wypelnia (organ|urzad|pracownik)|^(nr|numer) sprawy|instrukcj|podstawa prawna|(wielkimi|drukowanymi) literami"
  # oświadczenia i zgody -> CONSENT_SECTION (standard zabrania checkboxów na zgody)
  consent: "^(oswiadczam|wyrazam zgode|zgoda na|zapoznal(em|am)|potwierdzam|akceptuje|jestem swiadom)"
  # kwoty i miary -> NUMBER
  number: "\\b(kwota|kwoty|wysokosc|suma|razem|liczba|ilosc|powierzchnia|dlugosc|szerokosc)\\b"

# F-14: duplikaty sekcji standardowych (builder wstawia je z config/section_templates) - pola LLM out, wpis w trace
standard:
  # całe sekcje po tytule: organ, podmiot wniosku, twoje dane, adres zamieszkania/siedziby, firma, inna osoba, pełnomocnik, opłata, kontakt, zgody
  sections: "^(organ|urzad|adresat)\\b|do ktorego (jest )?sklada|^podmiot wniosku|^twoje dane|^adres (zamieszkania|siedziby)( wnioskodawcy| innej osoby)?$|^dane (podmiotu|innej osoby|do kontaktu|kontaktowe)$|^kontakt|jestes reprezentantem|pelnomocn|^oplata skarbowa|^zgod|\\brodo\\b|klauzul"
  # sekcje z danymi wnioskodawcy pomieszanymi z merytorycznymi - tu tylko pola z `applicant_fields`
  applicant: "wnioskodawc|^dane osobowe|^adres( zamieszkania)?$"
  # całe labele: "E-mail osoby odpowiedzialnej" w sekcji wnioskodawcy zostaje
  applicant_fields: "^(imie( i nazwisko)?|imiona|drugie imie|nazwisko|nazwa|(numer )?pesel|nip|regon|(numer )?krs|kraj|wojewodztwo|powiat|gmina|miejscowosc|poczta|kod pocztowy|ulica|(numer|nr) (budynku|domu|lokalu|mieszkania)|adres( zamieszkania| do korespondencji)?|(numer |nr )?telefonu?( kontaktowy)?|(adres )?e ?mail)( wnioskodawcy| zagranica| nazwa( wnioskodawcy)?| adres e ?mail)?$"
  # w każdej sekcji: pełnomocnik, wybór podmiotu, zgoda RODO / klauzula, organ
  fields: "pelnomocn|w czyim imieniu|jako kto wnioskujesz|przetwarz\\w* (moich )?danych|\\brodo\\b|klauzul\\w* informacyjn|^(nazwa |adres )?(organ|urzad|urzed)\\w*\\b|^adresat\\b"
  # usunięte pole z wartością pasujące tu -> Draft.organ, jeśli LLM go nie podał
  organ: "\\b(organ|urzad|urzed|adresat)\\w*"

rules:
  # --- słowniki (convert: TEXT_FIELD -> SELECT dozwolone; false = tylko gdy szkic już dał SELECT)
  - {match: "^(kraj|panstwo)\\b|obywatelstw", dictionary: Kraje}
  - {match: "^(wojewodztwo|powiat|gmina)$", dictionary: TERYT_4G_DOWODOWY}
  # miejscowość bywa zagraniczna (Kraj = Inny kraj) -> słownik tylko, gdy szkic sam dał listę wyboru
  - {match: "^miejscowosc$", dictionary: TERYT_4G_DOWODOWY, convert: false}
  - {match: "kierunkow|prefiks", dictionary: Numery kierunkowe}
  # --- walidatory (+ dane inicjalne)
  # prefill tylko przy zakotwiczonym labelu ("E-mail osoby odpowiedzialnej" to nie wnioskodawca), walidator zawsze
  - {match: "^(numer )?pesel$", validators: [PESEL], prefill: PESEL.pesel}
  - {match: "\\bpesel\\b", validators: [PESEL]}
  - {match: "\\bnip\\b", validators: [NIP]}
  - {match: "\\bregon\\b", validators: [REGON]}
  - {match: "e doreczen|doreczen elektronicznych", validators: [ADE]}
  - {match: "\\bepuap\\b", validators: [EPUAP]}
  - {match: "^(adres )?(e ?mail|poczty elektronicznej)$", validators: [EMAIL], prefill: MLPZ.email}
  - {match: "\\be ?mail\\b|poczty elektronicznej", validators: [EMAIL]}
  - {match: "^kod pocztowy$", validators: [ZIP_CODE], prefill: MLPZ.postCode}
  - {match: "dowodu osobistego|seria i numer dowodu", validators: [SERIAL_NUMBER_ID_CARD]}
  # --- dane inicjalne (readOnly jak w przykładach: imię/nazwisko tak, adres/kontakt edytowalne)
  - {match: "^imie$", prefill: MLPZ.name, read_only: true}
  - {match: "^drugie imie$", prefill: MLPZ.secondName, read_only: true}
  - {match: "^nazwisko$", prefill: MLPZ.surname, read_only: true}
  - {match: "^nazwisko rodowe$", prefill: PESEL.familyName}
  - {match: "^data urodzenia$", prefill: PESEL.birthDate}
  - {match: "^miejsce urodzenia$", prefill: PESEL.birthPlace}
  - {match: "^imie ojca$", prefill: PESEL.fatherName}
  - {match: "^imie matki$", prefill: PESEL.motherName}
  - {match: "^(numer |nr )?telefonu?( kontaktowy| kontaktowego| komorkowy| komorkowego)?$", prefill: MLPZ.phoneNumber}
  - {match: "^ulica$", prefill: MLPZ.street}
  - {match: "^(numer|nr) (budynku|domu)$", prefill: MLPZ.building}
  - {match: "^(numer|nr) (lokalu|mieszkania)$", prefill: MLPZ.apartment}
